<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">



  <form id="registerForm" action="dashboard.html" novalidate
        class="w-full max-w-md bg-white rounded-lg shadow p-6 space-y-4">
    <h1 class="text-2xl font-semibold text-slate-800">buat akun</h1>


<!--username-->    
    <div>
      <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
      <input type="text" id="username" name="username"
             class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="username-error" class="hidden text-sm text-red-600 mt-1"></p>
    </div>

<!--pwd-->
    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input type="password" id="password" name="password"
             class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="password-error" class="hidden text-sm text-red-600 mt-1"></p>
    </div>

<!--nama-->
    <div>
      <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama</label>
      <input type="text" id="nama" name="nama"
             class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="nama-error" class="hidden text-sm text-red-600 mt-1"></p>
    </div>

<!--tgl-->    
    <div>
      <label for="tanggalLahir" class="block text-sm font-medium text-slate-700 mb-1">Tanggal lahir</label>
      <input type="date" id="tanggalLahir" name="tanggalLahir"
             class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="tanggalLahir-error" class="hidden text-sm text-red-600 mt-1"></p>
    </div>

<!--almt-->
    <div>
      <label for="alamat" class="block text-sm font-medium text-slate-700 mb-1">Alamat</label>
      <textarea id="alamat" name="alamat" rows="3"
                class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      <p id="alamat-error" class="hidden text-sm text-red-600 mt-1"></p>
    </div>

    <div>
      <label for="telepon" class="block text-sm font-medium text-slate-700 mb-1">Nomor telepon</label>
      <input type="tel" id="telepon" name="telepon" placeholder="62812xxxxxxx"
             class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="telepon-error" class="hidden text-sm text-red-600 mt-1"></p>
    </div>

    <button type="submit"
            class="w-full rounded-md bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700 focus:outline-none  focus:ring-indigo-500 ">
      Daftar
    </button>
  </form>

  <script src="validasi_input.js"></script>
</body>
</html>
