<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - takoku</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <body class="bg-slate-900 min-h-screen flex items-center justify-center">

        
            <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-sm">

                <div class="text-center mb-8">
                    <h1 class="text-xl font-extrabold text-slate-900">
                        Tokoku
                    </h1>
                    <p class="text-slate-500 text-sm mt-2">Masuk </p>
                </div>
                <form>
                    <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <input type="text" placeholder="Masukkan username"
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-300">
                    </div>

                    <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input type="password" placeholder="Masukkan password"
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-300">
                    </div>

                    <button type="submit">
                        <a href="dashboard.html" ...>Login</a>
                    </button>
                </form>

            </div>
    
        

    </body>
    
</body>
